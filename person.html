<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Hanken+Grotesk:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Permanent+Marker&family=Special+Elite&family=Playfair+Display:wght@500;700&family=Inter:wght@400;600&display=swap">
<link rel="stylesheet" href="/site.css">
<title>TIFF Memories</title>
<style>
.hero{position:relative;height:72vh;min-height:340px;overflow:hidden;background:var(--surface)}
.hero>img,.hero>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero h1{position:absolute;left:clamp(16px,3vw,52px);right:16px;bottom:clamp(16px,3vw,40px);margin:0;font-family:var(--f-display);font-weight:500;
  font-size:clamp(3rem,10vw,9rem);line-height:.95;color:#fff;mix-blend-mode:difference;overflow-wrap:anywhere}
.hero.nob{height:auto;min-height:0;background:none;padding:calc(env(safe-area-inset-top,0px) + 120px) clamp(16px,3vw,52px) 0}
.hero.nob h1{position:static;color:var(--ink);mix-blend-mode:normal}
.info{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);padding:clamp(24px,4vw,56px) clamp(16px,3vw,52px)}
.back{display:inline-block;margin-bottom:18px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
.bio{max-width:40rem;white-space:pre-wrap;overflow-wrap:anywhere;font-size:1.08rem;margin:0}
.socials{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.socials a{display:flex;justify-content:space-between;gap:12px;text-decoration:none;border-bottom:1px solid var(--line);padding:10px 0}
.socials a:hover{border-bottom-color:var(--ink)}
.photos{padding-bottom:110px}
.photos h2{margin:0 0 14px;padding-inline:clamp(16px,3vw,52px);font-weight:400;color:var(--muted)}
.prow{display:flex;overflow-x:auto;padding-inline:clamp(16px,2.7vw,52px);scrollbar-width:thin;scrollbar-color:#8a8a8a var(--bg)}
.prow img,.prow video{height:min(78vh,820px);width:auto;display:block;flex:none;max-width:none}
.missing{padding:calc(env(safe-area-inset-top,0px) + 140px) clamp(16px,3vw,52px)}
.missing h1{font-family:var(--f-display);font-weight:500;font-size:clamp(2.4rem,7vw,5rem);line-height:1;margin:0 0 14px}
@media (max-width:820px){
  .hero{height:56vh}
  .info{grid-template-columns:minmax(0,1fr)}
  .prow{flex-direction:column;overflow:visible;padding-inline:0}
  .prow img,.prow video{width:100%;height:auto}
}
</style>
</head>
<body>
<div class="bar mono"><div class="bar-in">
  <a href="/">TIFF</a>
  <span class="mid"><a href="/">Memories</a><a href="/people">People</a></span>
  <span class="end"><button id="theme" type="button" aria-label="Switch light or dark">Theme</button></span>
</div></div>
<main id="page"></main>
<div class="foot mono">TIFF &copy;<span id="year"></span></div>
<script src="/site.js"></script>
<script src="/editor.js"></script>
<script src="/scrap.js"></script>
<script>
(function(){
  var S=window.Site,Ed=window.Editor,page=document.getElementById("page");
  var qp=new URLSearchParams(location.search).get("p");
  var slug=(qp||decodeURIComponent((location.pathname.split("/").filter(Boolean).pop()||""))).toLowerCase();
  var cur=null,admin=false,editing=false,newFile=null,bar=null;
  function heroHtml(banner,name,ed){
    var h1='<h1'+(ed?' contenteditable="plaintext-only" data-ph="Name" id="e-name"':'')+'>'+S.esc(name)+'</h1>';
    return banner
      ?'<div class="hero">'+(S.isVideo(banner)||(newFile&&/^blob:/.test(banner)&&Ed.isVideoFile(newFile))?'<video autoplay muted loop playsinline preload="metadata" src="'+S.esc(banner)+'"></video>':'<img alt="" src="'+S.esc(banner)+'">')+h1+'</div>'
      :'<div class="hero nob">'+h1+'</div>';
  }
  var designing=false,ctrl=null;
  function scrapView(){
    document.body.classList.add("scrap");
    page.innerHTML='<a class="sback" href="/people">&larr; People</a>';
    Scrap(page,cur.page,{edit:false});
    S.watchVideos(page);
  }
  function memPhotos(){
    var out=[];cur.mems.slice().sort(S.newer).forEach(function(m){S.pics(m).forEach(function(u){if(out.indexOf(u)<0)out.push(u)})});return out;
  }
  function design(){
    designing=true;if(bar){bar.remove();bar=null}
    var pg=cur.page&&cur.page.items&&cur.page.items.length?cur.page:{h:1400,bg:{color:"#f4efe6",image:"",pattern:"dots"},items:[
      {id:"t1",t:"text",text:cur.name,x:80,y:70,w:760,r:-3,z:2,size:120,color:"#222222",font:"Permanent Marker"},
      {id:"t2",t:"text",text:cur.bio||"Write something about "+cur.name+"...",x:120,y:330,w:420,r:1,z:1,size:30,color:"#333333",font:"Caveat"}]};
    document.body.classList.add("scrap");
    page.innerHTML='<a class="sback" href="/person?p='+encodeURIComponent(cur.slug)+'">&larr; Exit</a>';
    var tb=null;
    var c=Scrap(page,pg,{edit:true,onSelect:function(it){if(tb)tb.inspect(it)}});
    tb=Scrap.toolbar(c,{Ed:Ed,memPhotos:memPhotos(),
      cancel:function(){location.href="/person?p="+encodeURIComponent(cur.slug)},
      save:async function(pageData,say){
        try{
          var r=await Ed.api("/api/people",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"save",person:{id:cur.id||undefined,name:cur.name,bio:cur.bio,socials:cur.socials,banner:/^blob:/.test(cur.banner)?"":cur.banner,page:pageData}})});
          location.href="/person?p="+encodeURIComponent(r.person.slug);
        }catch(err){say(err.status===401?"Session ended. Sign in again.":err.message,"bad")}
      }});
  }
  function draw(){
    if(!editing&&!designing&&cur.page&&cur.page.items&&cur.page.items.length){scrapView();return}
    var p=cur,ed=editing;
    var socials=(p.socials||[]).map(function(s){
      return '<li><a class="mono" href="'+S.esc(s.url)+'" target="_blank" rel="noopener noreferrer"><span>'+S.esc(s.label)+'</span><span aria-hidden="true">&#8599;</span></a></li>';
    }).join("");
    var media=[];
    p.mems.slice().sort(S.newer).forEach(function(m){S.pics(m).forEach(function(u){media.push(u)})});
    var tags=media.map(function(u){
      return S.isVideo(u)?'<video controls muted loop playsinline preload="metadata" data-autoplay src="'+S.esc(u)+'"></video>':'<img alt="'+S.esc(p.name)+'" decoding="async" loading="lazy" src="'+S.esc(u)+'">';
    }).join("");
    var bioHtml=ed?'<p class="bio" id="e-bio" contenteditable="plaintext-only" data-ph="Write a bio...">'+S.esc(p.bio)+'</p>'
      :(p.bio?'<p class="bio">'+S.esc(p.bio)+'</p>':'<p class="note">No bio yet.</p>');
    var right=ed?'<div><div class="soced" id="e-soc"></div></div>':(socials?'<ul class="socials">'+socials+'</ul>':'<div></div>');
    page.innerHTML=heroHtml(p.banner,p.name,ed)+
      '<section class="info"><div><a class="back mono" href="/people">&larr; People</a>'+bioHtml+'</div>'+right+'</section>'+
      (media.length?'<section class="photos"><h2 class="mono">'+S.esc(p.name)+' in '+p.mems.length+(p.mems.length===1?' memory':' memories')+'</h2><div class="prow">'+tags+'</div></section>':'');
    document.body.classList.toggle("editing",ed);
    if(ed){
      var box=document.getElementById("e-soc");
      (p.socials&&p.socials.length?p.socials:[]).forEach(function(s){addRow(box,s.label,s.url)});
      var add=Ed.btn("+ Add link",function(){addRow(box,"","")});add.className="mono";
      box.parentNode.appendChild(add);
      var nm=document.getElementById("e-name");
      nm.addEventListener("keydown",function(e){if(e.key==="Enter")e.preventDefault()});
    }
    S.watchVideos(page);
  }
  function addRow(box,l,u){
    var r=document.createElement("div");r.className="r";
    r.innerHTML='<input class="lab" maxlength="30" placeholder="Instagram" value="'+S.esc(l)+'"><input class="url" maxlength="300" placeholder="https://..." value="'+S.esc(u)+'">';
    var x=document.createElement("button");x.type="button";x.textContent="\u00d7";x.setAttribute("aria-label","Remove link");
    x.addEventListener("click",function(){r.remove()});r.appendChild(x);box.appendChild(r);
  }
  function readDom(){
    cur.name=(document.getElementById("e-name").textContent||"").replace(/\s+/g," ").trim();
    cur.bio=(document.getElementById("e-bio").innerText||"").replace(/\n{3,}/g,"\n\n").trim();
    cur.socials=[].slice.call(document.querySelectorAll("#e-soc .r")).map(function(r){
      return {label:r.querySelector(".lab").value.trim(),url:r.querySelector(".url").value.trim()};
    }).filter(function(s){return s.label&&/^https?:\/\//i.test(s.url)});
  }
  function toolbar(){
    if(bar)bar.remove();
    bar=Ed.bar();
    if(!editing){bar.appendChild(Ed.btn("Design page",design,"pri"));bar.appendChild(Ed.btn("Edit details",function(){editing=true;document.body.classList.remove("scrap");draw();toolbar()}));if(cur.page)bar.appendChild(Ed.btn("Reset to standard",async function(){if(!cur.id)return;try{await Ed.api("/api/people",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"save",person:{id:cur.id,name:cur.name,bio:cur.bio,socials:cur.socials,banner:cur.banner,page:null}})});location.reload()}catch(e){alert(e.message)}}));return}
    var st=document.createElement("span");st.className="st";
    var file=document.createElement("input");file.type="file";file.hidden=true;
    file.accept="image/png,image/jpeg,image/webp,image/gif,video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov";
    file.addEventListener("change",function(){
      var f=file.files[0];if(!f)return;
      readDom();newFile=f;cur.banner=URL.createObjectURL(f);
      if(Ed.isVideoFile(f)&&!/^blob:/.test(cur.banner))cur.banner="";
      draw();toolbar();
    });
    var save=Ed.btn("Save",async function(){
      readDom();
      if(!cur.name){Ed.say(st,"Add a name first.","bad");return}
      save.disabled=true;Ed.say(st,"Saving.");
      try{
        var banner=newFile?await Ed.upload(newFile,function(n){Ed.say(st,"Uploading banner "+n+"%")}):(/^blob:/.test(cur.banner)?"":cur.banner);
        var r=await Ed.api("/api/people",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"save",person:{id:cur.id||undefined,name:cur.name,bio:cur.bio,socials:cur.socials,banner:banner}})});
        location.href="/person?p="+encodeURIComponent(r.person.slug);
      }catch(err){
        if(err.status===401){Ed.say(st,"Session ended. Reload with ?edit and sign in again.","bad")}else Ed.say(st,err.message,"bad");
        save.disabled=false;
      }
    },"pri");
    bar.appendChild(save);
    bar.appendChild(Ed.btn("Change banner",function(){file.click()}));
    bar.appendChild(Ed.btn("Remove banner",function(){readDom();cur.banner="";newFile=null;draw();toolbar()}));
    if(!cur.id){var tn=document.createElement("span");tn.className="st";tn.textContent="This name comes from memory tags. Save to give it a real page.";bar.appendChild(tn)}
    if(cur.id){
      var del=Ed.btn("Delete person",function(){
        del.textContent="Tap again to delete for good";
        del.onclick=async function(){
          try{await Ed.api("/api/people",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"delete",id:cur.id})});location.href="/people"}
          catch(err){Ed.say(st,err.message,"bad")}
        };
      });
      bar.appendChild(del);
    }
    bar.appendChild(Ed.btn("Cancel",function(){location.href="/person?p="+encodeURIComponent(slug)}));
    bar.appendChild(file);bar.appendChild(st);
  }
  S.load().then(function(d){
    var p=S.buildPeople(d.memories,d.people).filter(function(x){return x.slug===slug})[0];
    return Ed.init().then(function(a){admin=a;return p});
  }).then(function(p){
    if(!p&&admin&&slug){p={slug:slug,name:slug.replace(/-/g," "),bio:"",socials:[],banner:"",mems:[]}}
    if(!p){
      page.innerHTML='<div class="missing"><h1>Not found</h1><p class="note">There is nobody with this name yet.</p><p><a class="mono" href="/people">All people</a></p></div>';
      return;
    }
    cur=p;document.title=p.name+" \u00b7 TIFF";
    editing=admin&&/[?&]edit\b/.test(location.search);
    
    if(admin&&/[?&]design\b/.test(location.search)){design();return}
    draw();
    if(admin)toolbar();
  });
})();
</script>
</body>
</html>
